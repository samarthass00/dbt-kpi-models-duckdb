version: 2

models:
  - name: stg_shifts
    description: One row per scheduled shift. Overtime is hours worked beyond 8.
    columns:
      - name: shift_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employees')
                field: employee_id
      - name: worked_hours
        data_tests: [not_null]

  - name: stg_tasks
    description: One row per assigned task.
    columns:
      - name: task_id
        data_tests: [unique, not_null]
      - name: shift_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shifts')
                field: shift_id
      - name: task_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["completed", "cancelled"]

  - name: stg_employees
    description: Employees conformed with facility and department attributes.
    columns:
      - name: employee_id
        data_tests: [unique, not_null]
